---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        id: lint
        continue-on-error: true
        run: echo "lint placeholder"

      - name: Save PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Generate linter report
        if: always()
        run: echo "No issues found." > linter-report.txt

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
          if-no-files-found: ignore
